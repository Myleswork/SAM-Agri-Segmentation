name: weedyrice
version: 'dataset release, unspecified'
root: /root/train/dataset/weedy-rice/extracted/WeedyRice-RGBMS-DB
input_mode: rgb
size: 352
channels:
  rgb: [rgb_r, rgb_g, rgb_b]
  rgbnir4: [rgb_r, rgb_g, rgb_b, ms_nir]
  rgbms7: [rgb_r, rgb_g, rgb_b, ms_g, ms_r, ms_re, ms_nir]
rgb_mean: [0.485, 0.456, 0.406]
rgb_std: [0.229, 0.224, 0.225]
ms_scale: 255.0 # stored uint8, not calibrated reflectance
mask_values: {0: background, 255: weedy_rice}
augment_flip: false
