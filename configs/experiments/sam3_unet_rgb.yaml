experiment: sam3_unet_rgb_smoke
dataset:
  name: weedyrice
  version: dataset release, unspecified
  root: /root/train/dataset/weedy-rice/extracted/WeedyRice-RGBMS-DB
  input_mode: rgb
  size: 336
  channels:
    rgb:
    - rgb_r
    - rgb_g
    - rgb_b
    rgbnir4:
    - rgb_r
    - rgb_g
    - rgb_b
    - ms_nir
    rgbms7:
    - rgb_r
    - rgb_g
    - rgb_b
    - ms_g
    - ms_r
    - ms_re
    - ms_nir
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
  ms_scale: 255.0
  mask_values:
    0: background
    255: weedy_rice
  augment_flip: false
model:
  name: sam3_unet
  size: 336
  device: cuda:0
  num_classes: 1
  freeze_encoder: true
  train_adapter: true
  train_decoder: true
  train_stem: true
  pretrained: null
training:
  seed: 42
  epochs: 1
  batch_size: 1
  lr: 0.0002
  weight_decay: 0.0005
  precision: fp32
  grad_accumulation: 1
  num_workers: 0
  max_train_batches: 3
  max_eval_batches: 2
  threshold: 0.5
